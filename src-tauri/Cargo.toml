[package]
name = "erd9"
version = "1.0.0"
description = "ERD9 - Database modeling tool"
authors = ["Ja-Chul, Gu"]
edition = "2021"

[lib]
name = "erd9_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["oracle"]
# Oracle은 실행 시 Oracle Instant Client가 필요하다. 빼고 빌드하려면 --no-default-features
oracle = ["dep:oracle"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "net", "rt", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "postgres"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls"] }
oracle = { version = "0.6", optional = true }
rfd = "0.16"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
